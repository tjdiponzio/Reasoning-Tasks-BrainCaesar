<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Algebraic Sequence Reasoning Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        button, select, input { touch-action: manipulation; }
    </style>
</head>
<body class="bg-[#F5F5F7] text-slate-800 font-sans min-h-screen flex flex-col items-center p-2 sm:p-6">

  <div id="app" class="w-full max-w-3xl bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200 flex flex-col min-h-[600px]">
    <!-- Dynamic Content Injected Here -->
  </div>

  <script>
    // ==========================================
    // CONFIGURATION & TRIALS DATASET
    // ==========================================
    const CUSTOM_TRIALS = [
        [[1, 2, 3, 4, "X"], ["5", "6", "7"], 0],
        [[2, 4, 6, 8, "X"], ["10", "12", "9"], 0],
        [[3, 6, 12, 24, "X"], ["36", "48", "46"], 1],
        [[1, 4, 9, 16, "X"], ["21", "23", "25"], 2],
        [[5, 8, "X", 14, 17], ["11", "12", "9"], 0],
        [[6, 12, 18, "X", 30], ["112", "78", "24"], 2],
        [[80, 40, 20, 10, "X"], ["5", "8", "0"], 0],
        [[1, 1, 2, 3, "X", 8], ["4", "5", "6"], 1],
        [[2, 3, 5, 7, "X", 13], ["9", "7", "11"], 0],
        [[7, 14, 28, 56, "X"], ["112", "78", "70"], 0],
        [[16, "X", 4, 2, 1], ["10", "8", "6"], 1],
        [["X", 10, 15, 20, 25], ["5", "0", "3"], 0],
        [[20, 16, 12, "X", 4], ["8", "10", "6"], 0],
        [[6, 6, 12, 24, "X"], ["36", "48", "46"], 1],
        [[14, "X", 26, 32, 38], ["18", "22", "20"], 2],
        [[20, 17, "X", 11], ["13", "14", "15"], 0],
        [[4, 8, 12, 16, "X"], ["18", "20", "22"], 1],
        [[100, 90, 80, 70, "X"], ["60", "50", "65"], 0],
        [[2, 6, 18, 54, "X"], ["108", "162", "216"], 1],
        [[1, 3, 6, 10, "X"], ["14", "15", "16"], 1],
        [[50, 25, 12.5, "X", 3.125], ["6.25", "7.5", "5"], 0],
        [["X", 4, 9, 16, 25], ["0", "1", "2"], 1],
        [[3, 5, 9, 17, "X"], ["25", "31", "33"], 2],
        [[243, 81, 27, 9, "X"], ["1", "3", "0"], 1],
        [[1, 2, 4, 7, "X"], ["10", "11", "12"], 1],
        [[8, 16, "X", 32, 40], ["24", "26", "20"], 0],
        [[86, 43, 21.5, "X"], ["1", "10.5", "10.75"], 2],
        [[20, 30, 45, "X"], ["67.5", "65.75", "68.25"], 0],
        [[14, 21, "X", 35, 42], ["26", "28", "25"], 1],
        [[8, 16, 32, 64, "X"], ["108", "128", "118"], 1]
    ];

    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    let state = {
        currentTrialIdx: 0,
        results: [],
        startTime: 0,
        shuffledOptions: [],
        correctIdx: 0,
        answered: false
    };

    // Utility: Shuffle Array
    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ==========================================
    // GAME CONTROLLER
    // ==========================================
    function loadTrial(idx) {
        if (idx >= CUSTOM_TRIALS.length) {
            showSummary();
            return;
        }

        state.currentTrialIdx = idx;
        state.answered = false;

        const [sequence, optionTexts, correctOriginalIdx] = CUSTOM_TRIALS[idx];

        // Map and shuffle options
        const indexedOptions = optionTexts.map((text, i) => ({ text, originalIdx: i }));
        const shuffled = shuffle(indexedOptions);

        state.shuffledOptions = shuffled.map(o => o.text);
        state.correctIdx = shuffled.findIndex(o => o.originalIdx === correctOriginalIdx);

        renderTrialUI(sequence);
        state.startTime = performance.now();
    }

    function handleAnswer(selectedIdx) {
        if (state.answered) return;
        state.answered = true;

        const rt = performance.now() - state.startTime;
        const isCorrect = (selectedIdx === state.correctIdx);

        state.results.push({ correct: isCorrect, rt: rt });

        // Update button colors
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
            btn.disabled = true;
            if (i === state.correctIdx) {
                btn.className = "w-full text-left bg-emerald-500 text-white font-bold p-3 sm:p-4 rounded-xl shadow transition-all border border-emerald-600";
            } else if (i === selectedIdx && !isCorrect) {
                btn.className = "w-full text-left bg-rose-500 text-white font-bold p-3 sm:p-4 rounded-xl shadow transition-all border border-rose-600";
            } else {
                btn.className = "w-full text-left bg-slate-100 text-slate-400 p-3 sm:p-4 rounded-xl border border-slate-200 opacity-60";
            }
        });

        // Feedback Text
        const feedbackEl = document.getElementById('feedback-text');
        if (isCorrect) {
            feedbackEl.innerHTML = `<span class="text-emerald-600 font-bold">CORRECT! Option ${selectedIdx + 1} matches the rule.</span>`;
        } else {
            feedbackEl.innerHTML = `<span class="text-rose-600 font-bold">INCORRECT! Correct rule was Option ${state.correctIdx + 1}.</span>`;
        }

        setTimeout(() => {
            loadTrial(state.currentTrialIdx + 1);
        }, 1500);
    }

    // ==========================================
    // UI RENDERING
    // ==========================================
    function renderTrialUI(sequence) {
        const app = document.getElementById('app');
        app.innerHTML = `
            <!-- Header Bar -->
            <div class="bg-white border-b border-slate-200 py-3 px-4 sm:px-6 flex justify-between items-center shrink-0">
                <h1 class="text-sm sm:text-base font-bold text-slate-800">Algebraic Rule Deciphering Task</h1>
                <span id="lbl-progress" class="text-xs sm:text-sm font-semibold text-slate-600">Trial: ${state.currentTrialIdx + 1}/${CUSTOM_TRIALS.length}</span>
            </div>

            <!-- Main Container -->
            <div class="flex-grow p-4 sm:p-8 flex flex-col items-center justify-center space-y-6">
                <div class="w-full max-w-xl text-center space-y-5">
                    <h2 class="text-sm sm:text-base font-bold text-slate-700">Analyze the sequence and find the missing value:</h2>

                    <!-- Sequence Box Grid -->
                    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3">
                        ${sequence.map(val => `
                            <div class="w-12 h-12 sm:w-16 sm:h-16 bg-sky-500 text-white font-extrabold text-lg sm:text-2xl rounded-xl shadow-md flex items-center justify-center border-b-4 border-sky-700">
                                ${val}
                            </div>
                        `).join('')}
                    </div>

                    <h3 class="text-sm sm:text-base font-bold text-slate-700 pt-4">Select the correct number that fits the rule governing this sequence:</h3>

                    <!-- Options Grid -->
                    <div class="space-y-2 sm:space-y-3">
                        ${state.shuffledOptions.map((text, i) => `
                            <button onclick="handleAnswer(${i})" class="option-btn w-full text-left bg-white hover:bg-sky-50 active:scale-[0.99] text-slate-700 font-semibold p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 transition-all flex items-center justify-between">
                                <span>Option ${i + 1}: <strong class="text-slate-900">${text}</strong></span>
                                <span class="text-xs text-slate-400 font-mono">Select ➔</span>
                            </button>
                        `).join('')}
                    </div>

                    <div id="feedback-text" class="min-h-[28px] text-sm font-medium"></div>
                </div>
            </div>
        `;
    }

    function showSummary() {
        const total = state.results.length;
        const correctCnt = state.results.filter(r => r.correct).length;
        const acc = total > 0 ? (correctCnt / total) * 100 : 0;
        const meanRt = total > 0 ? state.results.reduce((a, b) => a + b.rt, 0) / total : 0;

        let summaryText = `Overall Accuracy: ${acc.toFixed(1)}% (${correctCnt}/${total})\nMean RT: ${meanRt.toFixed(0)} ms\n--------------------------------------------------\n`;
        state.results.forEach((res, i) => {
            const status = res.correct ? "Correct" : "Incorrect";
            summaryText += `Trial ${String(i + 1).padStart(2, '0')}: ${status.padEnd(9)} | Response Time: ${res.rt.toFixed(0).padStart(5)} ms\n`;
        });

        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="bg-white border-b border-slate-200 py-3 px-4 sm:px-6 flex justify-between items-center shrink-0">
                <h1 class="text-sm sm:text-base font-bold text-slate-800">Algebraic Rule Deciphering Task</h1>
                <span class="text-xs sm:text-sm font-semibold text-emerald-600">Complete</span>
            </div>

            <div class="flex-grow p-4 sm:p-8 flex flex-col items-center justify-center space-y-6">
                <div class="w-full max-w-xl bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4 text-center">
                    <h2 class="text-2xl font-bold text-slate-800">Task Completed!</h2>
                    <p class="text-sm sm:text-base font-medium text-slate-600">
                        Overall Accuracy: <strong class="text-slate-900">${acc.toFixed(1)}% (${correctCnt}/${total})</strong> | Mean Response Time: <strong class="text-slate-900">${meanRt.toFixed(0)} ms</strong>
                    </p>

                    <textarea readonly class="w-full h-48 bg-slate-50 text-slate-700 font-mono text-xs p-3 rounded-xl border border-slate-200 resize-none focus:outline-none">${summaryText}</textarea>

                    <div class="flex justify-center pt-2">
                        <button onclick="navigator.clipboard.writeText(document.querySelector('textarea').value); alert('Results copied to clipboard!');" class="bg-sky-600 hover:bg-sky-700 active:scale-95 text-white font-bold px-5 py-2.5 rounded-xl shadow transition-all text-sm">
                            📋 Copy Results to Clipboard
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    // Initial Launch
    window.addEventListener('DOMContentLoaded', () => {
        loadTrial(0);
    });
  </script>
</body>
</html>
