<body class="bg-[#F4F6F7] text-slate-800 font-sans min-h-screen flex flex-col items-center p-2 sm:p-6">

  <div id="app" class="w-full max-w-xl bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200 flex flex-col min-h-[550px]">
    <!-- Dynamic Content Injected Here -->
  </div>

  <script>
    // ==========================================
    // RANDOM EQUATION GENERATOR (Whole Numbers Only, X range 2-9)
    // ==========================================
    function generateTrial() {
        const types = ['add', 'sub', 'mult_add', 'mult_sub', 'div_add'];
        const type = types[Math.floor(Math.random() * types.length)];
        
        let x, eqStr;
        if (type === 'div_add') {
            const a = Math.random() < 0.5 ? 2 : 3;
            const validX = (a === 2) ? [2, 4, 6, 8] : [3, 6, 9];
            x = validX[Math.floor(Math.random() * validX.length)];
            const b = Math.floor(Math.random() * 10) + 1;
            const c = (x / a) + b;
            eqStr = `x / ${a} + ${b} = ${c}`;
        } else {
            x = Math.floor(Math.random() * 8) + 2; // X ranges from 2 to 9
            if (type === 'add') {
                const b = Math.floor(Math.random() * 15) + 1;
                const c = x + b;
                eqStr = `x + ${b} = ${c}`;
            } else if (type === 'sub') {
                const b = Math.floor(Math.random() * (x - 1)) + 1;
                const c = x - b;
                eqStr = `x - ${b} = ${c}`;
            } else if (type === 'mult_add') {
                const a = Math.floor(Math.random() * 3) + 2; // 2 to 4
                const b = Math.floor(Math.random() * 12) + 1;
                const c = (a * x) + b;
                eqStr = `${a}x + ${b} = ${c}`;
            } else if (type === 'mult_sub') {
                const a = Math.floor(Math.random() * 3) + 2; // 2 to 4
                const maxB = (a * x) - 1;
                if (maxB < 1) {
                    const b = Math.floor(Math.random() * 10) + 1;
                    const c = (a * x) + b;
                    eqStr = `${a}x + ${b} = ${c}`;
                } else {
                    const b = Math.floor(Math.random() * Math.min(10, maxB)) + 1;
                    const c = (a * x) - b;
                    eqStr = `${a}x - ${b} = ${c}`;
                }
            }
        }
        return { eqStr, solution: x };
    }

    function generateTrialsDataset() {
        let dataset = [];
        for (let i = 0; i < 30; i++) {
            dataset.push(generateTrial());
        }
        return dataset;
    }

    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    let state = {
        trials: [],
        currentTrialIdx: 0,
        results: [],
        currentXSolution: 0,
        startTime: 0,
        answered: false
    };

    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
